[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xle_leisaac"
version = "0.1.0"
description = "XLeRobot support for LeIsaac"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["xle_leisaac", "xle_leisaac.robots", "xle_leisaac.tasks", "xle_leisaac.devices"]
